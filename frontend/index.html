<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0F6E56" />
    <meta name="description" content="FairProctor — proctoring that does not punish a shared room" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>FairProctor</title>
    <script>
      // apply the saved or system theme before React loads, so there is no white flash in dark mode
      try {
        var t = localStorage.getItem("fp-theme");
        if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
