<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E2A4A">
<title>Before your test</title>
<style>
:root{--paper:#FFFFFF;--sheet:#FCF4F4;--rose:#E9C3C6;--ink:#1E2A4A;--ink-2:#4A5675;--ink-3:#6E7790;--rule:#E6E2E6;--ok:#2F6B4F;--fix:#9A5A0C;--bad:#B3261E;--link:#1F5FA8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#151A26;--sheet:#1C2231;--rose:#5A3E46;--ink:#E9ECF4;--ink-2:#B9C0D2;--ink-3:#8F98AE;--rule:#2B3346;--ok:#7FC4A2;--fix:#E5A24B;--bad:#F07A70;--link:#7EB0EE}}
:root[data-theme="dark"]{--paper:#151A26;--sheet:#1C2231;--rose:#5A3E46;--ink:#E9ECF4;--ink-2:#B9C0D2;--ink-3:#8F98AE;--rule:#2B3346;--ok:#7FC4A2;--fix:#E5A24B;--bad:#F07A70;--link:#7EB0EE}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Devanagari",sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 16px calc(32px + env(safe-area-inset-bottom))}
.lang{display:flex;justify-content:flex-end;gap:6px}
.lang button{border:1px solid var(--rule);background:var(--paper);border-radius:999px;padding:4px 12px;font:inherit;font-size:14px;color:inherit;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
h1{font-size:24px;line-height:1.25;margin:14px 0 6px}
.lead{color:var(--ink-2);margin:0 0 14px}
ol.steps{list-style:none;padding:0;margin:0;counter-reset:s}
ol.steps>li{counter-increment:s;border-top:1px solid var(--rule);padding:16px 0}
ol.steps>li>h2{font-size:18px;margin:0 0 6px;display:flex;gap:10px;align-items:center}
ol.steps>li>h2::before{content:counter(s);display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--sheet);border:1.5px solid var(--rose);font-size:15px;flex:none}
ol.steps>li.done>h2::before{content:"✓";background:var(--ok);border-color:var(--ok);color:var(--paper)}
.stage{position:relative;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:3/4;max-height:62vh;margin:10px auto 0;width:100%}
video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:block}
svg.guide{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.badge{position:absolute;left:12px;right:12px;bottom:12px;background:rgba(20,26,40,.82);color:#fff;border-radius:12px;padding:10px 12px;font-size:16px;line-height:1.35}
.checks{list-style:none;padding:0;margin:12px 0 0}
.checks li{display:grid;grid-template-columns:24px 1fr;gap:8px;padding:8px 0;border-bottom:1px solid var(--rule)}
.checks li:last-child{border-bottom:0}
.dot{width:14px;height:14px;border-radius:50%;margin-top:5px;background:var(--rule)}
.ok .dot{background:var(--ok)} .fix .dot{background:var(--fix)} .bad .dot{background:var(--bad)}
.checks b{display:block;font-weight:600}
.checks span{color:var(--ink-2);font-size:15.5px}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:12px;background:var(--ink);color:var(--paper);font:inherit;font-weight:700;margin-top:12px;cursor:pointer}
.btn.secondary{background:var(--paper);color:var(--ink);border:1.5px solid var(--ink)}
.btn[disabled]{opacity:.5;cursor:default}
.note{color:var(--ink-2);font-size:15.5px}
.small{color:var(--ink-3);font-size:14px}
label.chk{display:flex;gap:10px;align-items:flex-start;margin:10px 0;font-size:15.5px}
label.chk input{width:22px;height:22px;margin-top:2px;flex:none}
.summary{background:var(--sheet);border-radius:12px;padding:12px 14px}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}
</style>
</head>
<body>
<main>
  <div class="lang" role="group" aria-label="Language">
    <button data-lang="en" aria-pressed="true">English</button>
    <button data-lang="hi" aria-pressed="false">हिन्दी</button>
  </div>
  <h1 data-t="title"></h1>
  <p class="lead" data-t="lead"></p>

  <ol class="steps">
    <li id="s-net">
      <h2 data-t="net_h"></h2>
      <p class="note" id="net-msg" data-t="net_wait"></p>
    </li>
    <li id="s-cam">
      <h2 data-t="cam_h"></h2>
      <p class="note" data-t="cam_p"></p>
      <button class="btn" id="cam-start" data-t="cam_btn"></button>
      <p class="note" id="cam-err" role="alert"></p>
      <div class="stage" id="stage" hidden>
        <video id="v" playsinline muted autoplay></video>
        <svg class="guide" viewBox="0 0 300 400" aria-hidden="true">
          <defs><mask id="m"><rect width="300" height="400" fill="white"/><ellipse cx="150" cy="150" rx="78" ry="100" fill="black"/></mask></defs>
          <rect width="300" height="400" fill="rgba(0,0,0,.35)" mask="url(#m)"/>
          <ellipse id="oval" cx="150" cy="150" rx="78" ry="100" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="8 6"/>
          <rect id="facebox" fill="none" stroke="#7FC4A2" stroke-width="2" visibility="hidden"/>
          <path d="M40 330 h220" stroke="#fff" stroke-width="2" stroke-dasharray="4 6" opacity=".7"/>
        </svg>
        <div class="badge" id="badge" aria-live="polite"></div>
      </div>
      <ul class="checks" id="checks" hidden></ul>
      <label class="chk" id="desk-chk" hidden><input type="checkbox" id="desk"><span data-t="desk"></span></label>
    </li>
    <li id="s-done">
      <h2 data-t="done_h"></h2>
      <div class="summary" id="summary"><span class="note" data-t="done_wait"></span></div>
      <label class="chk"><input type="checkbox" id="consent"><span data-t="consent"></span></label>
      <button class="btn" id="go" data-t="go"></button>
      <p class="small" data-t="privacy"></p>
    </li>
  </ol>
  <canvas id="c" width="160" height="120" hidden></canvas>
</main>

<script>
/* ---------------- copy ---------------- */
const T = {
 en:{title:'Before your test', lead:'Two minutes to check your camera and connection. Fixing these now means fewer interruptions later. Nothing here is recorded or sent.',
  net_h:'Connection', net_wait:'Checking your connection…',
  net_good:s=>`Good connection (${s}). Video will be sent normally.`,
  net_slow:s=>`Slow connection (${s}). The test will send fewer camera pictures to save data. This is normal and will not count against you.`,
  net_none:'Could not reach the test server. Move to a spot with better signal, or turn mobile data off and on, then reload this page.',
  cam_h:'Camera and light', cam_p:'Prop your phone up so it stays still, about an arm’s length away, at face height. Your face should fill the oval.',
  cam_btn:'Turn on camera', cam_denied:'Camera permission was blocked. Open your browser settings, allow the camera for this site, then press the button again.',
  cam_none:'No camera found. Check that no other app is using the camera, then press the button again.',
  ok_all:'Looks good. Hold this position for the test.',
  c_light:'Light on your face', c_back:'Light behind you', c_face:'Face in the oval', c_sharp:'Clear picture', c_people:'One person in view',
  light_ok:'Bright enough.', light_dim:'Too dark. Turn on a light or face a window.', light_hot:'Too bright. Move away from direct sunlight.',
  back_ok:'Fine.', back_bad:'A window or light is behind you. Turn so the light is in front of you.',
  face_ok:'Centred and the right size.', face_none:'We can’t see your face. Look at the screen and move into the oval.',
  face_small:'Too far. Move the phone a little closer.', face_big:'Too close. Move the phone back so your shoulders show.',
  face_off:'Move so your face is in the middle of the oval.', face_manual:'Line your face up with the oval. (This phone can’t check it automatically.)',
  sharp_ok:'Clear.', sharp_bad:'Blurry. Wipe the camera lens and keep the phone still.',
  people_ok:'Only you.', people_more:'Someone else is in view. During the test it is fine if someone walks past, but sit where no one is beside you.',
  desk:'I have kept only the test device on my desk. My hands are free and no other phone is within reach.',
  done_h:'Ready to start', done_wait:'Finish the checks above.',
  left:n=>n>1?`${n} things still to fix. You can start anyway, but fixing them means fewer flags.`:'1 thing still to fix. You can start anyway, but fixing it means fewer flags.',
  allok:'Everything is ready.',
  consent:'Share these check results (numbers only, no pictures) with the test provider to help the reviewer understand my conditions.',
  go:'Start my test', privacy:'Your camera picture never leaves this phone during this check. During the test, only the results of face checks are kept, not your face, and they are deleted after the result.'},
 hi:{title:'परीक्षा से पहले', lead:'कैमरा और इंटरनेट जाँचने में दो मिनट लगेंगे। अभी ठीक कर लेंगे तो बाद में रुकावट कम होगी। यहाँ कुछ भी रिकॉर्ड या भेजा नहीं जाता।',
  net_h:'इंटरनेट', net_wait:'आपका इंटरनेट जाँच रहे हैं…',
  net_good:s=>`इंटरनेट अच्छा है (${s})। वीडियो सामान्य रूप से जाएगा।`,
  net_slow:s=>`इंटरनेट धीमा है (${s})। डेटा बचाने के लिए परीक्षा कम कैमरा तस्वीरें भेजेगी। यह सामान्य है और आपके ख़िलाफ़ नहीं गिना जाएगा।`,
  net_none:'परीक्षा सर्वर से जुड़ नहीं पाए। बेहतर नेटवर्क वाली जगह जाएँ या मोबाइल डेटा बंद करके फिर चालू करें, फिर यह पेज दोबारा खोलें।',
  cam_h:'कैमरा और रोशनी', cam_p:'फ़ोन को किसी चीज़ से टिका दें ताकि वह हिले नहीं, लगभग एक हाथ की दूरी पर, चेहरे की ऊँचाई पर। आपका चेहरा अंडाकार घेरे में होना चाहिए।',
  cam_btn:'कैमरा चालू करें', cam_denied:'कैमरे की अनुमति बंद है। ब्राउज़र सेटिंग में इस साइट के लिए कैमरा चालू करें, फिर बटन दोबारा दबाएँ।',
  cam_none:'कैमरा नहीं मिला। देखें कि कोई और ऐप कैमरा तो नहीं चला रहा, फिर बटन दोबारा दबाएँ।',
  ok_all:'सब ठीक है। परीक्षा में इसी तरह बैठें।',
  c_light:'चेहरे पर रोशनी', c_back:'पीछे की रोशनी', c_face:'चेहरा घेरे में', c_sharp:'साफ़ तस्वीर', c_people:'कैमरे में एक ही व्यक्ति',
  light_ok:'रोशनी ठीक है।', light_dim:'बहुत अँधेरा है। लाइट जलाएँ या खिड़की की ओर मुँह करें।', light_hot:'बहुत तेज़ रोशनी है। सीधी धूप से हट जाएँ।',
  back_ok:'ठीक है।', back_bad:'आपके पीछे खिड़की या लाइट है। ऐसे मुड़ें कि रोशनी आपके सामने हो।',
  face_ok:'बीच में और सही आकार में।', face_none:'चेहरा नहीं दिख रहा। स्क्रीन की ओर देखें और घेरे में आएँ।',
  face_small:'बहुत दूर हैं। फ़ोन थोड़ा पास लाएँ।', face_big:'बहुत पास हैं। फ़ोन पीछे करें ताकि कंधे दिखें।',
  face_off:'ऐसे बैठें कि चेहरा घेरे के बीच में हो।', face_manual:'चेहरे को घेरे के साथ मिलाएँ। (यह फ़ोन अपने-आप जाँच नहीं कर सकता।)',
  sharp_ok:'साफ़ है।', sharp_bad:'धुँधला है। कैमरे का लेंस पोंछें और फ़ोन स्थिर रखें।',
  people_ok:'केवल आप।', people_more:'कोई और भी दिख रहा है। परीक्षा के दौरान कोई पास से गुज़रे तो ठीक है, पर ऐसी जगह बैठें जहाँ आपके बगल में कोई न हो।',
  desk:'मेरी मेज़ पर केवल परीक्षा वाला डिवाइस है। मेरे हाथ खाली हैं और कोई दूसरा फ़ोन पास में नहीं है।',
  done_h:'शुरू करने के लिए तैयार', done_wait:'ऊपर की जाँच पूरी करें।',
  left:n=>`अभी ${n} चीज़ें ठीक करनी हैं। आप फिर भी शुरू कर सकते हैं, पर ठीक करने से फ़्लैग कम आएँगे।`,
  allok:'सब तैयार है।',
  consent:'इन जाँच के नतीजे (केवल अंक, कोई तस्वीर नहीं) परीक्षा संस्था से साझा करें, ताकि समीक्षक मेरी स्थिति समझ सकें।',
  go:'मेरी परीक्षा शुरू करें', privacy:'इस जाँच में आपकी कैमरा तस्वीर इस फ़ोन से बाहर नहीं जाती। परीक्षा के दौरान केवल चेहरा-जाँच के नतीजे रखे जाते हैं, आपका चेहरा नहीं, और परिणाम के बाद उन्हें मिटा दिया जाता है।'}
};
let lang = (navigator.language || '').startsWith('hi') ? 'hi' : 'en';
const $ = s => document.querySelector(s);
const state = {net:null, checks:{}, detector:null, mode:'none', running:false};

function applyLang(){
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach(el => { const v = T[lang][el.dataset.t]; if (typeof v === 'string') el.textContent = v; });
  document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  if (state.net) showNet();
  renderChecks(); renderSummary();
}
document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => { lang = b.dataset.lang; applyLang(); }));

/* ---------------- step 1: connection ---------------- */
async function testNet(){
  try{
    const t0 = performance.now();
    const r = await fetch('/api/precheck/probe?kb=150&r=' + Math.random(), {cache:'no-store'});
    const b = await r.arrayBuffer();
    const down = (b.byteLength * 8 / 1000) / ((performance.now() - t0) / 1000);
    const up0 = performance.now();
    await fetch('/api/precheck/probe', {method:'POST', body:new Uint8Array(60 * 1024)});
    const up = (60 * 1024 * 8 / 1000) / ((performance.now() - up0) / 1000);
    state.net = {down:Math.round(down), up:Math.round(up)};
  }catch(e){ state.net = {error:true}; }
  showNet();
}
function fmt(k){ return k >= 1000 ? (k/1000).toFixed(1) + ' Mbps' : k + ' kbps'; }
function showNet(){
  const n = state.net, el = $('#net-msg');
  if (n.error){ el.textContent = T[lang].net_none; return; }
  const s = `${fmt(n.down)} ↓ · ${fmt(n.up)} ↑`;
  el.textContent = n.up >= 400 ? T[lang].net_good(s) : T[lang].net_slow(s);
  $('#s-net').classList.add('done');
}

/* ---------------- step 2: camera ---------------- */
async function setupDetector(){
  if ('FaceDetector' in window){
    try{ state.detector = new FaceDetector({fastMode:true, maxDetectedFaces:3}); state.mode = 'native'; return; }catch(e){}
  }
  // only download a detector model when the connection can afford it
  if (state.net && !state.net.error && state.net.down > 1500){
    try{
      const vision = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14');
      const files = await vision.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
      const fd = await vision.FaceDetector.createFromOptions(files, {baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite'}, runningMode:'VIDEO'});
      state.detector = fd; state.mode = 'mediapipe'; return;
    }catch(e){ console.warn('face detector unavailable', e); }
  }
  state.mode = 'manual';
}

$('#cam-start').addEventListener('click', async () => {
  $('#cam-err').textContent = '';
  try{
    const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user', width:{ideal:640}, height:{ideal:480}}, audio:false});
    $('#v').srcObject = stream;
    $('#stage').hidden = false; $('#checks').hidden = false; $('#desk-chk').hidden = false; $('#cam-start').hidden = true;
    await setupDetector();
    state.running = true; loop();
  }catch(e){
    $('#cam-err').textContent = (e && (e.name === 'NotAllowedError' || e.name === 'SecurityError')) ? T[lang].cam_denied : T[lang].cam_none;
  }
});

async function detectFaces(v){
  try{
    if (state.mode === 'native'){
      const f = await state.detector.detect(v);
      return f.map(x => ({x:x.boundingBox.x / v.videoWidth, y:x.boundingBox.y / v.videoHeight, w:x.boundingBox.width / v.videoWidth, h:x.boundingBox.height / v.videoHeight}));
    }
    if (state.mode === 'mediapipe'){
      const r = state.detector.detectForVideo(v, performance.now());
      return r.detections.map(d => ({x:d.boundingBox.originX / v.videoWidth, y:d.boundingBox.originY / v.videoHeight, w:d.boundingBox.width / v.videoWidth, h:d.boundingBox.height / v.videoHeight}));
    }
  }catch(e){}
  return null; // unknown
}

// Map the region the candidate SEES inside the oval to the camera frame.
// The preview is object-fit:cover in a 3:4 box, and front cameras on phones often deliver
// portrait frames, so a fixed box in a squashed 160x120 frame measures hair and shirt instead
// of the face (field test: an evenly lit face read as "too dark").
function visibleToFrame(nx, ny, vw, vh){
  const br = 300 / 400, vr = vw / vh;
  let x0 = 0, y0 = 0, w = 1, h = 1;
  if (vr > br){ w = br / vr; x0 = (1 - w) / 2; } else { h = vr / br; y0 = (1 - h) / 2; }
  return [x0 + nx * w, y0 + ny * h];
}
function analyse(faces){
  const v = $('#v'), c = $('#c');
  const vw = v.videoWidth || 640, vh = v.videoHeight || 480;
  const W = vw >= vh ? 160 : 120, H = vw >= vh ? 120 : 160;
  if (c.width !== W){ c.width = W; c.height = H; }
  const ctx = c.getContext('2d', {willReadFrequently:true});
  ctx.drawImage(v, 0, 0, W, H);
  const px = ctx.getImageData(0, 0, W, H).data;
  const L = new Float32Array(W * H);
  for (let i = 0; i < L.length; i++) L[i] = 0.299 * px[i*4] + 0.587 * px[i*4+1] + 0.114 * px[i*4+2];
  let f = faces && faces.length ? faces.reduce((a, b) => (a.w * a.h > b.w * b.h ? a : b)) : null;
  // face core: detected box shrunk to its centre, else the centre of the oval (skin, not hair or clothes)
  let box;
  if (f){
    box = {x0:(f.x + f.w*0.2)*W, x1:(f.x + f.w*0.8)*W, y0:(f.y + f.h*0.25)*H, y1:(f.y + f.h*0.85)*H};
  } else {
    const [ax, ay] = visibleToFrame(103/300, 85/400, vw, vh), [bx, by] = visibleToFrame(197/300, 215/400, vw, vh);
    box = {x0:ax*W, y0:ay*H, x1:bx*W, y1:by*H};
  }
  // background: top band and side bands of what the candidate sees
  const [vx0, vy0] = visibleToFrame(0, 0, vw, vh), [vx1, vy1] = visibleToFrame(1, 1, vw, vh);
  const bgTop = vy0 + (vy1 - vy0) * 0.18, bgL = vx0 + (vx1 - vx0) * 0.15, bgR = vx1 - (vx1 - vx0) * 0.15;
  const facePx = [];
  let bs = 0, bn = 0;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){
    const l = L[y*W + x], nx = x / W, ny = y / H;
    if (x >= box.x0 && x <= box.x1 && y >= box.y0 && y <= box.y1) facePx.push(l);
    else if (nx >= vx0 && nx <= vx1 && ny >= vy0 && ny <= vy1 && (ny < bgTop || nx < bgL || nx > bgR)){ bs += l; bn++; }
  }
  facePx.sort((a, b) => a - b);
  const q = p => facePx.length ? facePx[Math.min(facePx.length - 1, Math.floor(p * facePx.length))] : 0;
  const face = q(0.5), faceHi = q(0.9), bg = bs / Math.max(bn, 1);
  // sharpness: variance of the Laplacian
  let s = 0, s2 = 0, n = 0;
  for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++){
    const i = y*W + x, lap = 4*L[i] - L[i-1] - L[i+1] - L[i-W] - L[i+W];
    s += lap; s2 += lap*lap; n++;
  }
  const sharp = s2/n - (s/n) ** 2;
  return {face, faceHi, bg, sharp, f, count: faces ? faces.length : null};
}

let hist = [];
async function loop(){
  if (!state.running) return;
  const v = $('#v');
  if (v.readyState >= 2){
    const faces = await detectFaces(v);
    const a = analyse(faces);
    hist.push(a); if (hist.length > 6) hist.shift();   // smooth over ~1.5 s
    const avg = k => hist.reduce((s, h) => s + (h[k] ?? 0), 0) / hist.length;
    const face = avg('face'), bg = avg('bg'), sharp = avg('sharp');
    const ck = {};
    // "Too dark" only when the face is genuinely underexposed: a low median AND no well-lit
    // skin at all. A plain brightness cut-off would tell candidates with darker skin to
    // "turn on a light" in a room that is fine.
    const faceHi = avg('faceHi');
    ck.light = (face < 45 || (face < 65 && faceHi < 95)) ? ['bad','light_dim'] : face > 215 ? ['fix','light_hot'] : ['ok','light_ok'];
    ck.back = (bg - face > 45 && bg > 120) ? ['bad','back_bad'] : ['ok','back_ok'];
    ck.sharp = sharp < 35 ? ['fix','sharp_bad'] : ['ok','sharp_ok'];
    if (state.mode === 'manual' || a.count === null){
      ck.face = ['fix','face_manual'];
    } else if (!a.f){
      ck.face = ['bad','face_none'];
    } else {
      const cx = a.f.x + a.f.w/2, cy = a.f.y + a.f.h/2;
      ck.face = a.f.w < 0.13 ? ['fix','face_small'] : a.f.w > 0.62 ? ['fix','face_big']
              : (Math.abs(cx - 0.5) > 0.16 || cy > 0.62) ? ['fix','face_off'] : ['ok','face_ok'];
      ck.people = a.count > 1 ? ['fix','people_more'] : ['ok','people_ok'];
    }
    state.checks = ck;
    state.last = {brightness:Math.round(face), backlight:Math.round(bg - face), face_found:!!a.f, face_size:a.f ? +a.f.w.toFixed(2) : null,
                  face_offset:a.f ? +(Math.abs(a.f.x + a.f.w/2 - 0.5)).toFixed(2) : null, blur:Math.round(sharp)};
    drawBox(a.f);
    renderChecks(); renderSummary();
  }
  setTimeout(loop, 250);
}
function drawBox(f){
  const b = $('#facebox');
  if (!f){ b.setAttribute('visibility','hidden'); return; }
  // the video is mirrored and object-fit:cover in a 3:4 box; map roughly for feedback
  const v = $('#v'), vr = v.videoWidth / v.videoHeight, br = 300/400;
  let sx = 300, sy = 400, ox = 0, oy = 0;
  if (vr > br){ sx = 400 * vr; ox = (300 - sx) / 2; } else { sy = 300 / vr; oy = (400 - sy) / 2; }
  b.setAttribute('x', ox + (1 - f.x - f.w) * sx); b.setAttribute('y', oy + f.y * sy);
  b.setAttribute('width', f.w * sx); b.setAttribute('height', f.h * sy); b.setAttribute('visibility','visible');
}

const ORDER = [['back','c_back'], ['light','c_light'], ['face','c_face'], ['people','c_people'], ['sharp','c_sharp']];
function renderChecks(){
  const ck = state.checks, t = T[lang];
  if (!Object.keys(ck).length) return;
  $('#checks').innerHTML = ORDER.filter(([k]) => ck[k]).map(([k, label]) =>
    `<li class="${ck[k][0]}"><i class="dot"></i><div><b>${t[label]}</b><span>${t[ck[k][1]]}</span></div></li>`).join('');
  const firstFix = ORDER.map(([k]) => ck[k]).find(c => c && c[0] !== 'ok');
  $('#badge').textContent = firstFix ? t[firstFix[1]] : t.ok_all;
  $('#oval').setAttribute('stroke', firstFix ? '#fff' : '#7FC4A2');
  $('#oval').setAttribute('stroke-dasharray', firstFix ? '8 6' : '0');
}
function problems(){
  return Object.values(state.checks).filter(c => c[0] !== 'ok' && c[1] !== 'face_manual').length + ($('#desk').checked ? 0 : 1);
}
function renderSummary(){
  if (!Object.keys(state.checks).length) return;
  const n = problems(), t = T[lang];
  $('#summary').innerHTML = `<span class="note">${n ? t.left(n) : t.allok}</span>`;
  $('#s-cam').classList.toggle('done', n === 0);
  $('#s-done').classList.toggle('done', n === 0);
}
$('#desk').addEventListener('change', renderSummary);

$('#go').addEventListener('click', async () => {
  const body = Object.assign({}, state.last || {}, {
    consent: $('#consent').checked, camera_ok: !!state.last, passed: problems() === 0,
    down_kbps: state.net?.down ?? null, up_kbps: state.net?.up ?? null, device: /Mobi/i.test(navigator.userAgent) ? 'phone' : 'desktop'});
  try{ await fetch('/api/precheck/result', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)}); }catch(e){}
  state.running = false;
  const s = $('#v').srcObject; if (s) s.getTracks().forEach(tr => tr.stop());
  $('#go').disabled = true;
  $('#summary').innerHTML = `<span class="note">${lang === 'hi' ? 'जाँच पूरी हुई। (डेमो: परीक्षा यहाँ शुरू होगी।)' : 'Check complete. (Demo: the test would start here.)'}</span>`;
});

applyLang();
testNet();
</script>
