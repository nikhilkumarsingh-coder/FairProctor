<title>Share of malpractice caught vs share of candidates reviewed</title>
<desc>Out-of-fold results on synthetic data. Reviewing the top 6% of candidates catches 91% of malpractice in both tests. The question test reaches every confirmed case at 45% of candidates; the coding review line is at 9% of candidates and 95% of cases.</desc>
