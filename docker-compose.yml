# FairProctor with PostgreSQL and the demo data:   docker compose up --build   → http://localhost:8000
# Start over with fresh demo data:                   docker compose down -v && docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fairproctor
      POSTGRES_PASSWORD: fairproctor
      POSTGRES_DB: fairproctor
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fairproctor -d fairproctor"]
      interval: 3s
      timeout: 3s
      retries: 30

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://fairproctor:fairproctor@db:5432/fairproctor
      FP_JWT_SECRET: ${FP_JWT_SECRET:-local-demo-secret-change-me-before-sharing-0f3a9c2e}
      FP_DEMO: "1"            # the "Try the demo" logins on the login page
      FP_SEED_DEMO: "1"       # load the demo data on the first start
      FP_CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    volumes:
      - ./pilot/out:/app/pilot/out   # pilot cards, keys and reports (python -m pilot.* via docker compose exec app ...)

volumes:
  pgdata:
